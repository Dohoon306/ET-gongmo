spring:
  application:
    name: et-backend
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:et}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:et}
    password: ${DB_PASSWORD:et1234}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: optional:classpath:db/schema.sql
      encoding: UTF-8

server:
  port: 8080

app:
  ai:
    api-key: ${AI_API_KEY:}
