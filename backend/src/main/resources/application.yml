spring:
  application:
    name: et-backend
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:et}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:et}
    password: ${DB_PASSWORD:et1234}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations:
        - optional:classpath:db/schema/user.sql
        - optional:classpath:db/schema/contest.sql
        - optional:classpath:db/schema/team.sql
        - optional:classpath:db/schema/bookmark.sql
        - optional:classpath:db/schema/profile.sql
        - optional:classpath:db/schema/admin.sql
      encoding: UTF-8

server:
  port: 8080

app:
  contest-collection:
    endpoint: ${GONGMOA_MCP_URL:https://www.gongmoaview.com/mcp}
    fields: it,idea,design,video,marketing
    target: univ
    limit: 20
    snapshot-directory: ${CONTEST_SNAPSHOT_DIRECTORY:data/contest-snapshots}
  contest-classification:
    hero-gongmoa-id: ${HERO_GONGMOA_ID:100049285}
  ai:
    api-key: ${ET_GPT_API_KEY:}
    model: ${ET_GPT_MODEL:gpt-6.2-astra}
    timeout: ${ET_GPT_TIMEOUT:5s}
